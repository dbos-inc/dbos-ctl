name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per PR: a new push cancels the superseded one, which matters most for
# the integration job (containers, ~2 min) whose result is stale the moment the
# branch moves. Scoped to pull_request — pushes to main keep every run, so main
# has an unbroken per-commit history to bisect.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Generated code must match the vendored spec. This needs no conductor and
      # no jq — only the vendored internal/api/openapi-3.1.json and the Go module
      # cache — so it is a pure hermetic drift check.
      - name: generated code is up to date
        run: |
          make generate
          git diff --exit-code

      - run: make lint
      - run: make build
      - run: make test JUNIT=unit-tests.xml

      # `show: skip` is the point, not a detail: a skipped tier still reports a
      # green job, so the summary is what distinguishes "passed" from "never ran".
      - name: unit test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: unit-tests.xml
          show: "fail, skip"

      - name: upload unit test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: unit-tests.xml

  # Builds the flake, so a go.sum change without a vendorHash refresh fails the PR.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          # Avoids anonymous GitHub API rate limits when fetching nixpkgs.
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      # The Go dependency derivation is never on cache.nixos.org, so cache the store.
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'go.sum') }}
      # A bare `nix flake check` evaluates only the current system (since Nix 2.19).
      - run: nix flake check --all-systems

  integration:
    # Container-backed (tier 3). Needs only Docker — the harness pulls the latest
    # published conductor image from Docker Hub, so there is no conductor checkout
    # to build here. Because that tag moves, a conductor release can turn this job
    # red with no change in this repo; set the CONDUCTOR_IMAGE repo variable to
    # pin an older tag and confirm that, without a code change. The license key
    # gates the tier at runtime (fork PRs get no secret → the tests skip and the
    # job stays green).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: integration tests
        env:
          DBOS_CONDUCTOR_LICENSE_KEY: ${{ secrets.CONDUCTOR_LOCAL_LICENSE_KEY }}
          CONDUCTOR_IMAGE: ${{ vars.CONDUCTOR_IMAGE }}
        run: make test-integration JUNIT=integration-tests.xml

      # Without the license key every conductor test skips and this job still
      # goes green, which is indistinguishable from a pass on the checks list.
      # The summary makes that visible.
      - name: integration test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: integration-tests.xml
          show: "fail, skip"

      - name: upload integration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: integration-tests.xml

  # The migration tests, once per supported system database *version*. The
  # migration set differs between the two engines in a dozen places — no
  # CONCURRENTLY, a different migration 10 and 28, no triggers, no ALTER
  # FUNCTION — so running the same suite against each is the only thing that
  # says those differences are the intended ones. Separate from the integration
  # job so a failure names the engine in the checks list, and so conductor is
  # not stood up twice to learn nothing.
  #
  # Every supported version, not just the newest, because the differences that
  # matter here are between *releases* of one engine and a single current
  # version hides them. Migrations 36, 40 and 41 add a column and index it, and
  # CockroachDB refused that in one transaction until v25 — a bug that survived
  # in four SDKs precisely because every CI ran one recent CockroachDB. The
  # oldest supported release is the one that catches this class of thing.
  #
  # Versions are pinned to a minor stream (or a major, for PostgreSQL) rather
  # than :latest so a database release cannot turn a job red with no change in
  # this repo. Retiring a version means deleting its row; adding one means
  # adding a row. The suite reads DBOS_TEST_<ENGINE>_IMAGE, and the unset half
  # of each pair is an empty string, which imageFor treats as absent.
  #
  # Needs no license key, so this tier still gates fork PRs, where the conductor
  # tier can only skip.
  migrations:
    name: migrations (${{ matrix.engine }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            version: "14"
            postgres_image: postgres:14
          - engine: postgres
            version: "15"
            postgres_image: postgres:15
          - engine: postgres
            version: "16"
            postgres_image: postgres:16
          - engine: postgres
            version: "17"
            postgres_image: postgres:17
          - engine: postgres
            version: "18"
            postgres_image: postgres:18
          - engine: cockroach
            version: "24.1"
            cockroach_image: cockroachdb/cockroach:latest-v24.1
          - engine: cockroach
            version: "24.3"
            cockroach_image: cockroachdb/cockroach:latest-v24.3
          - engine: cockroach
            version: "25.2"
            cockroach_image: cockroachdb/cockroach:latest-v25.2
          - engine: cockroach
            version: "25.4"
            cockroach_image: cockroachdb/cockroach:latest-v25.4
          - engine: cockroach
            version: "26.2"
            cockroach_image: cockroachdb/cockroach:latest-v26.2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: migration tests
        env:
          DBOS_TEST_POSTGRES_IMAGE: ${{ matrix.postgres_image }}
          DBOS_TEST_COCKROACH_IMAGE: ${{ matrix.cockroach_image }}
        run: make test-migrations ENGINE=${{ matrix.engine }} JUNIT=migration-tests.xml

      - name: migration test summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: migration-tests.xml
          show: "fail, skip"

      - name: upload migration test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: migration-test-results-${{ matrix.engine }}-${{ matrix.version }}
          path: migration-tests.xml

  # Regenerate the client from each *upstream* spec and check the CLI still
  # compiles. The build job's drift check is hermetic — it only proves the
  # vendored spec and the generated code agree — so nothing else notices when a
  # deployed API moves out from under us. This does.
  #
  # It is deliberately sensitive: oapi-codegen turns an operation's query
  # parameters into a *params struct argument*, so upstream adding one optional
  # parameter changes a Go signature and breaks the build here, even though the
  # API stayed backward compatible and the CLI keeps working at runtime. That
  # is the intended signal — "the generated client would change" — not a claim
  # that the deployed API is broken.
  api-compat:
    name: build against ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Advisory: these specs move without a commit here, and a red mark on
    # someone's unrelated PR should inform, not block. The job still shows up
    # and the step summary says what changed.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # The image the integration tier already runs against.
          - name: conductor latest
            fetch: docker run --rm --entrypoint /app/dbos-conductor dbosdev/conductor:latest openapi
          # Conductor's own spec with `servers` repointed, served publicly by
          # the managed proxy — so this tracks whichever conductor cloud has
          # actually deployed, which lags the released image.
          - name: cloud
            fetch: curl -fsS --retry 3 --max-time 60 https://cloud.dbos.dev/conductor/v2/openapi.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A fetch failure is infrastructure, not an API break — warn and stop
      # rather than reporting a compatibility problem we did not observe.
      - name: fetch the ${{ matrix.name }} spec
        id: fetch
        run: |
          set -o pipefail
          if ${{ matrix.fetch }} | jq -S . > upstream-spec.json; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=spec unavailable::Could not fetch the ${{ matrix.name }} spec; compatibility not checked."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: regenerate the client and build
        if: steps.fetch.outputs.ok == 'true'
        run: |
          cp upstream-spec.json internal/api/openapi-3.1.json
          make generate
          make build
          make test

      # Runs on failure too — when the build breaks, the spec delta is the
      # first thing anyone will want.
      - name: what differs from the vendored spec
        if: always() && steps.fetch.outputs.ok == 'true'
        run: |
          {
            echo "## ${{ matrix.name }} vs the vendored spec"
            echo
            if git diff --quiet -- internal/api/openapi-3.1.json; then
              echo "Identical — the vendored spec is what ${{ matrix.name }} serves."
            else
              echo '```'
              git --no-pager diff --stat -- internal/api
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
